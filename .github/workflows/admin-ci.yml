name: Admin CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: node --test tests/*.test.js
      - name: Syntax-check application JavaScript
        shell: bash
        run: |
          set -e
          for file in js/*.js admin/*.js; do
            node --check "$file"
          done
