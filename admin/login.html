<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#252824">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="بوابة إدارة منفصلة لمتجر سنتر الجويلي.">
  <title>إدارة سنتر الجويلي | دخول بالكود</title>
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body data-page="admin-login" data-root="../" class="is-admin-page">
  <main id="admin-access-page" class="page-root" tabindex="-1">
    <div class="page-wrap auth-page">
      <div class="auth-panel">
        <div class="auth-form-area">
          <a class="auth-back" href="../index.html">← العودة للموقع</a>
          <span class="eyebrow">CENTER EL GOWAILY · ADMIN</span>
          <h1>دخول الإدارة</h1>
          <p class="auth-intro">أدخل كود الإدارة للوصول إلى لوحة التحكم.</p>
          <form id="admin-code-form" class="auth-form">
            <label class="field">
              <span>كود الإدارة</span>
              <input name="code" type="password" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" required minlength="6" aria-describedby="admin-code-error">
            </label>
            <div id="admin-code-error" class="form-error" role="alert" hidden></div>
            <button class="button button-primary button-full" type="submit">دخول لوحة الإدارة</button>
          </form>
          <p class="admin-service-note">هذه البوابة منفصلة عن تسجيل دخول العملاء.</p>
        </div>
        <aside class="auth-visual">
          <img src="../assets/images/hero-editorial.jpg" alt="" loading="lazy">
          <span class="auth-visual-shade"></span>
          <div>
            <span class="eyebrow">CENTER EL GOWAILY · ADMIN</span>
            <h2>إدارة المتجر من مكان واحد.</h2>
            <p>المنتجات والطلبات والمخزون والتصنيفات والعروض والإعدادات.</p>
          </div>
          <span class="auth-visual-mark">ج</span>
        </aside>
      </div>
    </div>
  </main>
  <script defer src="../js/config.js"></script>
  <script defer src="./gate.js"></script>
</body>
</html>
